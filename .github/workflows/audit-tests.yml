name: Audit engine checks
on:
  push:
    branches: [main]
    paths:
      - 'web-app/backend/**'
      - '.github/workflows/audit-tests.yml'
  pull_request:
    paths:
      - 'web-app/backend/**'
      - '.github/workflows/audit-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run audit engine unit tests
        run: npm test
      - name: Type-check eligibility engine
        run: npx tsc --noEmit
